name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # 'stable' rather than go-version-file: go.mod, which would pin the
          # declared minimum patch release and fail govulncheck on stdlib CVEs.
          go-version: 'stable'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: go test -run=XXX -fuzz=FuzzLevelOf -fuzztime=30s ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
